<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 極速一小時多頭排列儀表板 (漲幅前100)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@700;800;900&display=swap');
:root {
    --bg-dark: #060911;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(0, 240, 255, 0.25);
    --manga-pink: #ff007f;
    --manga-purple: #9d4edd;
    --manga-cyan: #00f0ff;
    --manga-yellow: #ffea00;
    --manga-orange: #ff9100;
    --manga-green: #00ff66;
    --manga-red: #ff2a6d;
}
* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.12) 0px, transparent 50%), radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 20px 20px;
    color: #fff;
    margin: 0;
    padding-bottom: 50px;
    min-height: 100vh;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }
.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 12, 22, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.header-title {
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 30%, var(--manga-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 6px;
}
.scan-btn {
    background: linear-gradient(135deg, var(--manga-pink) 0%, #ff5500 100%);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    transition: transform 0.15s ease, filter 0.2s ease;
    will-change: transform;
}
.scan-btn:active { transform: scale(0.95); }
.scan-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
.progress-container { height: 3px; background: rgba(255, 255, 255, 0.05); width: 100%; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--manga-pink), var(--manga-cyan)); transition: width 0.05s linear; }
.tab-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 0 16px; margin-top: 12px; }
.tab-btn {
    padding: 10px 4px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.8rem;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
}
.tab-btn.active {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--manga-cyan);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
}
.tab-btn.low-risk {
    background: rgba(255, 234, 0, 0.15);
    border-color: var(--manga-yellow);
    color: var(--manga-yellow);
}
.tab-btn.low-risk.active {
    background: rgba(255, 234, 0, 0.3);
    border-color: var(--manga-yellow);
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 234, 0, 0.4);
}
.dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    backdrop-filter: blur(10px);
}
.stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800; }
.stat-card.entry { border-color: rgba(255, 0, 127, 0.4); }
.stat-card.entry .val { color: var(--manga-pink); text-shadow: 0 0 10px rgba(255, 0, 127, 0.3); }
.container { padding: 0 16px; }
.symbol-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid var(--manga-green);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, background-color 0.2s;
    will-change: transform;
}
.symbol-card:hover { border-color: var(--manga-cyan); background: rgba(0, 240, 255, 0.08); transform: translateY(-2px); }
.symbol-card:active { transform: scale(0.98); }
.symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; }
.symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); font-weight: 700; }
.detail-row { font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; margin-top: 4px; }
.badge-rank { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 255, 255, 0.1); color: #fff; }
.badge-bull { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(0, 255, 102, 0.15); color: var(--manga-green); border: 1px solid var(--manga-green); }
.badge-lowrisk { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 234, 0, 0.2); color: var(--manga-yellow); border: 1px solid var(--manga-yellow); }
.val-up { color: var(--manga-green); }
.val-down { color: var(--manga-red); }
.chart-modal {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    background: rgba(4, 6, 14, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 4px;
    overflow: hidden;
    touch-action: pan-y;
}
.chart-modal.active { display: flex; }
.chart-box {
    width: 100%; max-width: 1050px;
    height: 100%; max-height: 100vh; max-height: 100dvh;
    background: #0b0f19;
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
    position: relative;
    transition: transform 0.15s ease-out;
}
.chart-header {
    padding: 8px 12px;
    background: #111726;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    gap: 4px;
    flex-shrink: 0;
    z-index: 2;
}
.header-title-group { display: flex; align-items: center; gap: 8px; }
.symbol-title { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800; color: #fff; }
.symbol-rank-tag { font-size: 0.75rem; color: var(--manga-cyan); font-weight: 800; }
.legend-bar { display: flex; gap: 6px; font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 3px; }
.legend-color { width: 6px; height: 6px; border-radius: 2px; }
.close-btn {
    background: rgba(255,255,255,0.08);
    color: #a0aec0;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 28px; height: 28px;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease;
    flex-shrink: 0;
}
.close-btn:hover { background: var(--manga-red); color: #fff; border-color: var(--manga-red); }
.nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--manga-cyan);
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; cursor: pointer; z-index: 10;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
}
.nav-btn:hover { background: var(--manga-cyan); color: #000; box-shadow: 0 0 12px var(--manga-cyan); }
.nav-btn.prev { left: 8px; }
.nav-btn.next { right: 8px; }
.charts-wrapper { flex: 1; width: 100%; display: flex; flex-direction: column; background: #060911; overflow: hidden; min-height: 0; }
.chart-panel { flex: 1; width: 100%; position: relative; min-height: 0; }
.panel-tag {
    position: absolute; top: 6px; left: 10px; z-index: 5;
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; font-weight: 800;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(0,0,0,0.6); color: var(--manga-cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
    pointer-events: none;
}
canvas { display: block; width: 100%; height: 100%; }
@media (max-width: 600px) {
    .chart-modal { padding: 0; }
    .chart-box { max-height: 100vh; max-height: 100dvh; border-radius: 0; border: none; }
    .chart-header { padding: 6px 10px; }
    .symbol-title { font-size: 0.9rem; }
    .legend-bar { font-size: 0.5rem; gap: 3px; }
    .nav-btn { width: 32px; height: 32px; font-size: 1rem; opacity: 0.6; }
}
</style>
</head>
<body>
<div class="app-header">
    <div class="header-top">
        <div class="header-title">⚡ 1H 多頭排列儀表板 (漲幅前100)</div>
        <button id="scanBtn" class="scan-btn">啟動極速掃描</button>
    </div>
</div>
<div class="progress-container"><div id="progress" class="progress-fill"></div></div>
<div class="tab-container">
    <button id="tab1h" class="tab-btn active">⚡ 1H 多頭排列(<span id="count1h">0</span>)</button>
    <button id="tabLowRisk" class="tab-btn low-risk">⭐ 1H 閃電精選(<span id="countLowRisk">0</span>)</button>
</div>
<div class="dashboard">
    <div class="stat-card">
        <div class="val" id="statTotal" style="color:var(--manga-cyan)">0</div>
        <div style="font-size:0.75rem; color:#64748b; margin-top:2px;">掃描目標數 (漲幅前100)</div>
    </div>
    <div class="stat-card entry">
        <div class="val" id="statEntry">0</div>
        <div style="font-size:0.75rem; color:#64748b; margin-top:2px;" id="statLabel">當前清單符合數</div>
    </div>
</div>
<div class="container" id="symbolList"></div>

<div id="chartModal" class="chart-modal" aria-hidden="true">
    <button id="prevBtn" class="nav-btn prev" aria-label="上一隻">❮</button>
    <button id="nextBtn" class="nav-btn next" aria-label="下一隻">❯</button>
    <div id="chartBox" class="chart-box" role="dialog" aria-modal="true">
        <div class="chart-header">
            <div class="header-title-group">
                <span id="symbolRankTag" class="symbol-rank-tag">#1</span>
                <div id="symbolTitle" class="symbol-title">BTCUSDT</div>
            </div>
            <div class="legend-bar">
                <div class="legend-item"><div class="legend-color" style="background:#00ff66"></div>5MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>30MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff9100"></div>45MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff007f"></div>60MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#00f0ff"></div>DIF</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>DEA</div>
            </div>
            <button id="closeModalBtn" class="close-btn" aria-label="關閉">✕</button>
        </div>
        <div class="charts-wrapper" id="chartsWrapper">
            <div class="chart-panel" id="wrapper1h" data-period="1h">
                <span class="panel-tag" id="tagText1h">1H (K線+MACD)</span>
                <canvas id="klineCanvas1h"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    const API_BASE = 'https://fapi.binance.com';
    const P0 = 5, P1 = 30, P2 = 45, P3 = 60;
    const COUNT_1H = 80;

    const FETCH_LIMIT_1H = COUNT_1H + Math.max(P3, 35);

    let results1H = [];
    let resultsLowRisk = [];
    let activeTab = '1h';
    let tickerMap = new Map();
    let currentIndex = -1;
    const klinesCache = new Map();

    const dom = {
        scanBtn: document.getElementById('scanBtn'),
        progress: document.getElementById('progress'),
        statTotal: document.getElementById('statTotal'),
        statEntry: document.getElementById('statEntry'),
        count1h: document.getElementById('count1h'),
        countLowRisk: document.getElementById('countLowRisk'),
        tab1h: document.getElementById('tab1h'),
        tabLowRisk: document.getElementById('tabLowRisk'),
        symbolList: document.getElementById('symbolList'),
        chartModal: document.getElementById('chartModal'),
        symbolTitle: document.getElementById('symbolTitle'),
        symbolRankTag: document.getElementById('symbolRankTag'),
        closeModalBtn: document.getElementById('closeModalBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        wrapper1h: document.getElementById('wrapper1h'),
        canvas1h: document.getElementById('klineCanvas1h'),
        tagText1h: document.getElementById('tagText1h')
    };

    const ctx1h = dom.canvas1h.getContext('2d');

    function calculateSMA(data, period) {
        const len = data.length;
        if (len < period) return new Array(len).fill(null);
        const ma = new Array(len).fill(null);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += data[i] - data[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }

    function calculateMACD(closes, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
        const len = closes.length;
        const dif = new Array(len).fill(null);
        const dea = new Array(len).fill(null);
        const histogram = new Array(len).fill(null);

        let kFast = 2 / (fastPeriod + 1);
        let kSlow = 2 / (slowPeriod + 1);
        let kSignal = 2 / (signalPeriod + 1);

        let emaFast = null;
        let emaSlow = null;
        let emaSignal = null;

        for (let i = 0; i < len; i++) {
            const price = closes[i];
            if (emaFast === null) {
                emaFast = price;
                emaSlow = price;
            } else {
                emaFast = price * kFast + emaFast * (1 - kFast);
                emaSlow = price * kSlow + emaSlow * (1 - kSlow);
            }

            if (i >= slowPeriod - 1) {
                const d = emaFast - emaSlow;
                dif[i] = d;
                if (emaSignal === null) {
                    emaSignal = d;
                } else {
                    emaSignal = d * kSignal + emaSignal * (1 - kSignal);
                }
                if (i >= slowPeriod - 1 + signalPeriod - 1) {
                    dea[i] = emaSignal;
                    histogram[i] = (d - emaSignal) * 2;
                }
            }
        }
        return { dif, dea, histogram };
    }

    function formatVolumeText(volume) {
        const yi = volume / 100000000;
        return yi.toFixed(2) + '億';
    }

    const workerCode = `
    function calculateSMA(data, period) {
        const len = data.length;
        if (len < period) return new Array(len).fill(null);
        const ma = new Array(len).fill(null);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += data[i] - data[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }
    function checkAboveMAs30_45_60(closes, ma30, ma45, ma60, idx) {
        if (idx < 0 || idx >= closes.length) return false;
        const price = closes[idx];
        const m30 = ma30[idx], m45 = ma45[idx], m60 = ma60[idx];
        return (m30 !== null && price >= m30) && (m45 !== null && price >= m45) && (m60 !== null && price >= m60);
    }
    function checkIsFirstBarLightning(klinesRaw) {
        const totalLen = klinesRaw.length;
        if (totalLen < 60) return false;
        const closes = klinesRaw.map(k => parseFloat(k[4]));
        const ma1Arr = calculateSMA(closes, 30);
        const ma2Arr = calculateSMA(closes, 45);
        const ma3Arr = calculateSMA(closes, 60);

        const nowIdx = totalLen - 1;
        const prevIdx = totalLen - 2;

        const isNowAbove = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, nowIdx);
        const isPrevAbove = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, prevIdx);

        return isNowAbove && !isPrevAbove;
    }

    function isBullishAlignment(klinesRaw) {
        const totalLen = klinesRaw.length;
        if (totalLen < 60) return null;
        const closes = klinesRaw.map(k => parseFloat(k[4]));
        const price = closes[totalLen - 1];
        const ma1Arr = calculateSMA(closes, 30);
        const ma2Arr = calculateSMA(closes, 45);
        const ma3Arr = calculateSMA(closes, 60);
        const ma1 = ma1Arr[totalLen - 1];
        const ma2 = ma2Arr[totalLen - 1];
        const ma3 = ma3Arr[totalLen - 1];
        if (ma1 !== null && ma2 !== null && ma3 !== null && ma1 > ma2 && ma2 > ma3 && price >= ma3) {
            const ma3DistPercent = ((price - ma3) / ma3) * 100;
            const isAboveAllNow = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, totalLen - 1);
            return { price, ma3DistPercent, isAboveAllMAs: isAboveAllNow };
        }
        return null;
    }

    async function fetchWithRetry(url, retries = 3, delay = 500) {
        for (let i = 0; i < retries; i++) {
            try {
                const res = await fetch(url);
                if (res.status === 429 || res.status === 418) {
                    await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
                    continue;
                }
                if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
                return await res.json();
            } catch (err) {
                if (i === retries - 1) throw err;
                await new Promise(r => setTimeout(r, delay));
            }
        }
        throw new Error('Max retries exceeded');
    }

    async function fetchSymbol(symbol, apiBase, limit) {
        try {
            const klines1h = await fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=1h&limit=\${limit}\`);
            const bull1h = isBullishAlignment(klines1h);

            if (!bull1h) return null;

            const lightning1h = checkIsFirstBarLightning(klines1h);

            return {
                symbol, bull1h,
                isLightningMatch: lightning1h,
                currentPrice: bull1h.price,
                rawKlines: { k1h: klines1h }
            };
        } catch {
            return null;
        }
    }

    self.onmessage = async function(e) {
        const { symbols, apiBase, limit } = e.data;
        const concurrency = 8;
        let completed = 0;
        const matches = [];

        for (let i = 0; i < symbols.length; i += concurrency) {
            const chunk = symbols.slice(i, i + concurrency);
            const chunkResults = await Promise.all(chunk.map(sym => fetchSymbol(sym, apiBase, limit)));
            chunkResults.filter(Boolean).forEach(res => matches.push(res));
            completed += chunk.length;
            self.postMessage({ type: 'progress', completed, total: symbols.length });
            await new Promise(r => setTimeout(r, 50));
        }
        self.postMessage({ type: 'done', matches });
    };
    `;

    async function startScan() {
        dom.scanBtn.disabled = true;
        dom.scanBtn.innerText = "⚡ 背景極速掃描中...";
        dom.symbolList.replaceChildren();
        dom.progress.style.width = '0%';
        klinesCache.clear();

        let allTickers = [];
        try {
            const res = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`);
            if (res.ok) {
                allTickers = await res.json();
                tickerMap.clear();
                allTickers.forEach(d => tickerMap.set(d.symbol, d));
            }
        } catch {
            alert("無法取得行情數據，請檢查網路連線。");
            dom.scanBtn.disabled = false;
            dom.scanBtn.innerText = "啟動極速掃描";
            return;
        }

        const candidateSymbols = allTickers
            .filter(d => d.symbol.endsWith('USDT'))
            .sort((a, b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent))
            .slice(0, 100)
            .map(d => d.symbol);

        dom.statTotal.innerText = candidateSymbols.length;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        worker.postMessage({
            symbols: candidateSymbols,
            apiBase: API_BASE,
            limit: FETCH_LIMIT_1H
        });

        worker.onmessage = (e) => {
            const { type, completed, total, matches } = e.data;
            if (type === 'progress') {
                dom.progress.style.width = `${(completed / total) * 100}%`;
            } else if (type === 'done') {
                worker.terminate();
                const allMatches = matches.map(m => {
                    const ticker = tickerMap.get(m.symbol);
                    klinesCache.set(m.symbol, m.rawKlines);
                    return {
                        symbol: m.symbol,
                        price: m.currentPrice,
                        bull1h: m.bull1h,
                        isLightningMatch: m.isLightningMatch,
                        priceChange24h: ticker ? parseFloat(ticker.priceChangePercent) : 0,
                        quoteVolume24h: ticker ? parseFloat(ticker.quoteVolume) : 0
                    };
                });

                results1H = allMatches.filter(m => m.bull1h);
                resultsLowRisk = allMatches.filter(m => m.isLightningMatch);

                const sortByChange = (a, b) => b.priceChange24h - a.priceChange24h;
                results1H.sort(sortByChange);
                resultsLowRisk.sort(sortByChange);

                dom.count1h.innerText = results1H.length;
                dom.countLowRisk.innerText = resultsLowRisk.length;

                dom.scanBtn.disabled = false;
                dom.scanBtn.innerText = "啟動極速掃描";
                renderList();
            }
        };
    }

    function getCurrentList() {
        switch (activeTab) {
            case '1h': return results1H;
            case 'lowRisk': return resultsLowRisk;
            default: return [];
        }
    }

    function renderList() {
        const currentList = getCurrentList();
        dom.statEntry.innerText = currentList.length;

        if (currentList.length === 0) {
            dom.symbolList.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; font-weight:800;">目前無符合該條件之標的</div>`;
            return;
        }

        const fragment = document.createDocumentFragment();
        currentList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'symbol-card';
            card.addEventListener('click', () => openChartModal(index));

            const chg24Class = item.priceChange24h >= 0 ? 'val-up' : 'val-down';
            const chg24Sign = item.priceChange24h >= 0 ? '+' : '';

            let badgeHtml = '';
            if (activeTab === 'lowRisk') {
                badgeHtml = `<span class="badge-lowrisk">⚡ 1H 閃電第一根突破</span>`;
            } else {
                badgeHtml = `<span class="badge-bull">⚡ 1H 多頭排列</span>`;
            }

            let distText = '';
            if (activeTab === 'lowRisk') {
                distText = `觸發狀態: <span class="val-up">1H 剛突破所有均線</span>`;
            } else {
                distText = `距 1H 60MA: <span class="val-up">+${item.bull1h.ma3DistPercent.toFixed(2)}%</span>`;
            }

            card.innerHTML = `
                <div style="flex: 1;">
                    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                        <span class="badge-rank">#${index + 1}</span>
                        <span class="symbol-name">${item.symbol.replace('USDT','')}</span>
                        ${badgeHtml}
                    </div>
                    <div class="detail-row">
                        ${distText}
                    </div>
                    <div class="detail-row">
                        24H 漲跌幅: <span class="${chg24Class}">${chg24Sign}${item.priceChange24h.toFixed(2)}%</span> | 24H 成交額: <span style="color:#00f0ff;">$${formatVolumeText(item.quoteVolume24h)}</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="symbol-price">${item.price}</div>
                    <div style="font-size:0.7rem; color:var(--manga-cyan); margin-top:4px;">點擊看 1H 圖表 📈</div>
                </div>
            `;
            fragment.appendChild(card);
        });
        dom.symbolList.replaceChildren(fragment);
    }

    function renderCanvasChart(canvas, wrapper, ctx, klinesRaw, showCount) {
        const closesAll = klinesRaw.map(k => parseFloat(k[4]));
        const ma5All = calculateSMA(closesAll, P0);
        const ma30All = calculateSMA(closesAll, P1);
        const ma45All = calculateSMA(closesAll, P2);
        const ma60All = calculateSMA(closesAll, P3);
        const macdAll = calculateMACD(closesAll);

        const actualShowCount = Math.min(showCount, klinesRaw.length);
        const showStartIndex = klinesRaw.length - actualShowCount;

        const showK = klinesRaw.slice(-actualShowCount);
        const showMA5 = ma5All.slice(-actualShowCount);
        const showMA30 = ma30All.slice(-actualShowCount);
        const showMA45 = ma45All.slice(-actualShowCount);
        const showMA60 = ma60All.slice(-actualShowCount);
        const showDIF = macdAll.dif.slice(-actualShowCount);
        const showDEA = macdAll.dea.slice(-actualShowCount);
        const showHist = macdAll.histogram.slice(-actualShowCount);

        const rect = wrapper.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        const padding = { top: 20, bottom: 6, left: 6, right: 60 };
        const totalH = height - padding.top - padding.bottom;
        const priceH = totalH * 0.65;
        const macdH = totalH * 0.28;

        const macdTop = padding.top + priceH + totalH * 0.07;
        const chartW = width - padding.left - padding.right;

        let minP = Infinity, maxP = -Infinity;
        showK.forEach((k) => {
            const l = parseFloat(k[3]), h = parseFloat(k[2]);
            if (l < minP) minP = l;
            if (h > maxP) maxP = h;
        });

        let maxMacdVal = 0;
        showDIF.forEach((v, i) => {
            if (v !== null && Math.abs(v) > maxMacdVal) maxMacdVal = Math.abs(v);
            const deaVal = showDEA[i];
            if (deaVal !== null && Math.abs(deaVal) > maxMacdVal) maxMacdVal = Math.abs(deaVal);
            const histVal = showHist[i];
            if (histVal !== null && Math.abs(histVal) > maxMacdVal) maxMacdVal = Math.abs(histVal);
        });
        maxMacdVal = maxMacdVal || 1;

        const priceRange = maxP - minP || 1;
        const getYPrice = (p) => padding.top + priceH - ((p - minP) / priceRange) * priceH;
        const getYMacd = (v) => macdTop + macdH / 2 - (v / maxMacdVal) * (macdH / 2 * 0.85);

        const barWidth = chartW / actualShowCount;

        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.fillStyle = '#64748b';
        ctx.font = '8px JetBrains Mono';
        ctx.textAlign = 'left';
        ctx.lineWidth = 1;

        const gridLines = 3;
        for (let i = 0; i <= gridLines; i++) {
            const y = padding.top + (priceH / gridLines) * i;
            const pVal = maxP - (priceRange / gridLines) * i;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();
            ctx.fillText(pVal.toFixed(2), width - padding.right + 3, y + 3);
        }

        const zeroY = getYMacd(0);
        ctx.beginPath();
        ctx.moveTo(padding.left, zeroY);
        ctx.lineTo(width - padding.right, zeroY);
        ctx.stroke();
        ctx.fillText('0.00', width - padding.right + 3, zeroY + 3);

        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

        showK.forEach((k, i) => {
            const timestamp = parseInt(k[0]);
            const date = new Date(timestamp);
            const utcDay = date.getUTCDay();
            const utcHour = date.getUTCHours();
            const utcMin = date.getUTCMinutes();

            const isMondayStart = (utcDay === 1 && utcHour === 0);
            const isDailyStart = (utcHour === 0 && utcMin === 0);

            if (isMondayStart) {
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.75)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 3]);
                const x = padding.left + i * barWidth + barWidth / 2;
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + totalH);
                ctx.stroke();

                ctx.save();
                ctx.font = 'bold 8px JetBrains Mono';
                ctx.fillStyle = '#9d4edd';
                ctx.textAlign = 'center';
                ctx.fillText('週一', x, padding.top - 5);
                ctx.restore();
            } else if (isDailyStart) {
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([3, 3]);
                const x = padding.left + i * barWidth + barWidth / 2;
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + totalH);
                ctx.stroke();

                ctx.save();
                ctx.font = '7px JetBrains Mono';
                ctx.fillStyle = '#00f0ff';
                ctx.textAlign = 'center';
                ctx.fillText(`週${dayNames[utcDay]}`, x, padding.top - 5);
                ctx.restore();
            }
        });

        ctx.setLineDash([]);
        ctx.lineWidth = 1;

        const drawLine = (dataArray, color, getYFunc, width = 1, isDashed = false) => {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            if (isDashed) ctx.setLineDash([3, 2]);
            else ctx.setLineDash([]);
            ctx.beginPath();
            let started = false;
            dataArray.forEach((val, i) => {
                if (val === null) return;
                const x = padding.left + i * barWidth + barWidth / 2;
                const y = getYFunc(val);
                if (!started) {
                    ctx.moveTo(x, y);
                    started = true;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
            ctx.restore();
        };

        drawLine(showMA5, '#00ff66', getYPrice);
        drawLine(showMA30, '#ffea00', getYPrice);
        drawLine(showMA45, '#ff9100', getYPrice);
        drawLine(showMA60, '#ff007f', getYPrice);

        // 修改後的 MACD 柱體繪製與動能遞增／遞減顏色區分
        showHist.forEach((hVal, i) => {
            if (hVal === null) return;
            const x = padding.left + i * barWidth + barWidth / 2;
            const yH = getYMacd(hVal);
            const bw = Math.max(barWidth * 0.7, 1);
            
            const prevHVal = (i > 0 && showHist[i - 1] !== null) ? showHist[i - 1] : 0;
            const isIncreasing = hVal >= prevHVal;

            if (hVal >= 0) {
                // 零軸上方（多頭）：遞增亮綠、遞減暗綠
                ctx.fillStyle = isIncreasing ? 'rgba(0, 255, 102, 0.85)' : 'rgba(0, 150, 60, 0.65)';
            } else {
                // 零軸下方（空頭）：動能加劇亮紅、減緩暗紅
                ctx.fillStyle = isIncreasing ? 'rgba(255, 100, 150, 0.65)' : 'rgba(255, 42, 109, 0.85)';
            }

            ctx.fillRect(x - bw / 2, Math.min(zeroY, yH), bw, Math.max(Math.abs(yH - zeroY), 1));
        });

        drawLine(showDIF, '#00f0ff', getYMacd, 1);
        drawLine(showDEA, '#ffea00', getYMacd, 1);

        showK.forEach((k, i) => {
            const absoluteIdx = showStartIndex + i;
            const open = parseFloat(k[1]), high = parseFloat(k[2]), low = parseFloat(k[3]), close = parseFloat(k[4]);
            const x = padding.left + i * barWidth + barWidth / 2;
            const isUp = close >= open;
            const color = isUp ? '#00ff66' : '#ff2a6d';

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, getYPrice(high));
            ctx.lineTo(x, getYPrice(low));
            ctx.stroke();

            const yOpen = getYPrice(open);
            const yClose = getYPrice(close);
            const bodyTop = Math.min(yOpen, yClose);
            const bodyH = Math.max(Math.abs(yOpen - yClose), 1);
            const bw = Math.max(barWidth * 0.7, 1);
            ctx.fillRect(x - bw / 2, bodyTop, bw, bodyH);

            const checkAboveMAs30_45_60 = (closes, ma30, ma45, ma60, idx) => {
                if (idx < 0 || idx >= closes.length) return false;
                const price = closes[idx];
                return (ma30[idx] !== null && price >= ma30[idx]) &&
                       (ma45[idx] !== null && price >= ma45[idx]) &&
                       (ma60[idx] !== null && price >= ma60[idx]);
            };

            const isNowAbove = checkAboveMAs30_45_60(closesAll, ma30All, ma45All, ma60All, absoluteIdx);
            const isPrevAbove = checkAboveMAs30_45_60(closesAll, ma30All, ma45All, ma60All, absoluteIdx - 1);

            if (isNowAbove && !isPrevAbove) {
                ctx.save();
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = '#ffea00';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 5;
                const highY = getYPrice(high);
                ctx.fillText('⚡', x, highY - 2);
                ctx.restore();
            }
        });
    }

    function loadAndDrawCharts(symbol) {
        dom.tagText1h.innerText = `1H (${COUNT_1H}) - K線 + MACD`;
        const cached = klinesCache.get(symbol);
        if (cached) {
            renderCanvasChart(dom.canvas1h, dom.wrapper1h, ctx1h, cached.k1h, COUNT_1H);
        }
    }

    function openChartModal(index) {
        const currentList = getCurrentList();
        if (index < 0 || index >= currentList.length) return;
        currentIndex = index;
        const item = currentList[currentIndex];

        dom.symbolRankTag.innerText = `#${currentIndex + 1}`;
        dom.symbolTitle.innerText = item.symbol;
        dom.chartModal.classList.add('active');
        dom.chartModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');

        loadAndDrawCharts(item.symbol);
    }

    function closeChartModal() {
        dom.chartModal.classList.remove('active');
        dom.chartModal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        currentIndex = -1;
    }

    function navigateSymbol(direction) {
        const currentList = getCurrentList();
        if (currentIndex === -1 || currentList.length === 0) return;
        let newIndex = currentIndex + direction;
        if (newIndex < 0) newIndex = currentList.length - 1;
        if (newIndex >= currentList.length) newIndex = 0;
        openChartModal(newIndex);
    }

    let touchStartX = 0, touchStartY = 0;
    let touchEndX = 0, touchEndY = 0;

    dom.chartModal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    dom.chartModal.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
            if (deltaX < 0) navigateSymbol(1);
            else navigateSymbol(-1);
        }
    }

    function switchTab(tabKey, targetBtn) {
        activeTab = tabKey;
        [dom.tab1h, dom.tabLowRisk].forEach(b => b.classList.remove('active'));
        targetBtn.classList.add('active');
        renderList();
    }

    dom.tab1h.addEventListener('click', () => switchTab('1h', dom.tab1h));
    dom.tabLowRisk.addEventListener('click', () => switchTab('lowRisk', dom.tabLowRisk));

    dom.scanBtn.addEventListener('click', startScan);
    dom.closeModalBtn.addEventListener('click', closeChartModal);
    dom.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(-1); });
    dom.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(1); });

    dom.chartModal.addEventListener('click', (e) => {
        if (e.target === dom.chartModal) closeChartModal();
    });

    window.addEventListener('keydown', (e) => {
        if (!dom.chartModal.classList.contains('active')) return;
        if (e.key === 'Escape') closeChartModal();
        else if (e.key === 'ArrowLeft') navigateSymbol(-1);
        else if (e.key === 'ArrowRight') navigateSymbol(1);
    });

    let resizeRaf = null;
    window.addEventListener('resize', () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => {
            if (dom.chartModal.classList.contains('active') && currentIndex !== -1) {
                const currentList = getCurrentList();
                if (currentList[currentIndex]) {
                    loadAndDrawCharts(currentList[currentIndex].symbol);
                }
            }
        });
    });
})();
</script>

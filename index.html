<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 極速多週期多頭排列儀表板 (幣安 成交額前200)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@700;800;900&display=swap');
:root {
    --bg-dark: #060911;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(0, 240, 255, 0.25);
    --manga-pink: #ff007f;
    --manga-purple: #9d4edd;
    --manga-cyan: #00f0ff;
    --manga-yellow: #ffea00;
    --manga-orange: #ff9100;
    --manga-green: #00ff66;
    --manga-red: #ff2a6d;
}
* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.12) 0px, transparent 50%), radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 20px 20px;
    color: #fff;
    margin: 0;
    padding-bottom: 50px;
    min-height: 100vh;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }
.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 12, 22, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-title {
    font-size: 1.08rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 30%, var(--manga-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 6px;
}
.source-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255, 234, 0, 0.12);
    color: var(--manga-yellow);
    border: 1px solid rgba(255, 234, 0, 0.45);
    -webkit-text-fill-color: var(--manga-yellow);
}
.scan-btn {
    background: linear-gradient(135deg, var(--manga-pink) 0%, #ff5500 100%);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    transition: transform 0.15s ease, filter 0.2s ease;
    will-change: transform;
}
.scan-btn:active { transform: scale(0.95); }
.scan-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
.progress-container { height: 3px; background: rgba(255, 255, 255, 0.05); width: 100%; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--manga-pink), var(--manga-cyan)); transition: width 0.05s linear; }
.tab-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 0 12px; margin-top: 12px; }
.tab-btn {
    padding: 8px 2px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.65rem;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tab-btn.active {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--manga-cyan);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
}
.tab-btn.low-risk {
    background: rgba(255, 234, 0, 0.15);
    border-color: var(--manga-yellow);
    color: var(--manga-yellow);
}
.tab-btn.low-risk.active {
    background: rgba(255, 234, 0, 0.3);
    border-color: var(--manga-yellow);
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 234, 0, 0.4);
}
.sort-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.sort-label {
    font-size: 0.72rem;
    font-weight: 800;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
}
.sort-btn {
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.7rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.18s ease;
}
.sort-btn.active {
    background: rgba(255, 0, 127, 0.18);
    border-color: var(--manga-pink);
    color: #fff;
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.22);
}
.dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    backdrop-filter: blur(10px);
}
.stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800; }
.stat-card.entry { border-color: rgba(255, 0, 127, 0.4); }
.stat-card.entry .val { color: var(--manga-pink); text-shadow: 0 0 10px rgba(255, 0, 127, 0.3); }
.container { padding: 0 16px; }

.symbol-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid var(--manga-green);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, background-color 0.2s;
    will-change: transform;
}
.symbol-card.tier-high {
    border-left-color: var(--manga-pink);
    box-shadow: inset 3px 0 12px rgba(255, 0, 127, 0.14);
}
.symbol-card.tier-mid {
    border-left-color: var(--manga-cyan);
}
.symbol-card:hover { border-color: var(--manga-cyan); background: rgba(0, 240, 255, 0.08); transform: translateY(-2px); }
.symbol-card:active { transform: scale(0.98); }

.card-left { flex: 1; min-width: 0; }
.card-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    text-align: right;
    flex-shrink: 0;
}

.symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; }
.symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); font-weight: 700; }
.detail-row { font-size: 0.76rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; margin-top: 5px; line-height: 1.35; }
.badge-rank { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 255, 255, 0.1); color: #fff; }
.badge-bull { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(0, 255, 102, 0.15); color: var(--manga-green); border: 1px solid var(--manga-green); }
.badge-multi { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 0, 127, 0.15); color: #ff66b2; border: 1px solid var(--manga-pink); }
.badge-super { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: linear-gradient(90deg, rgba(255, 0, 127, 0.25), rgba(0, 240, 255, 0.2)); color: #fff; border: 1px solid var(--manga-cyan); }
.badge-lowrisk { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 234, 0, 0.2); color: var(--manga-yellow); border: 1px solid var(--manga-yellow); }

.tf-matrix {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-top: 7px;
}
.tf-pill {
    border-radius: 6px;
    padding: 4px 4px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15, 23, 42, 0.55);
}
.tf-pill .tf-label {
    font-size: 0.62rem;
    font-weight: 800;
    color: #64748b;
    display: block;
    line-height: 1.1;
}
.tf-pill .tf-sub {
    font-size: 0.58rem;
    font-weight: 700;
    color: #475569;
    display: block;
    margin-top: 2px;
    line-height: 1.1;
}
.tf-pill.active-tf {
    background: rgba(0, 255, 102, 0.12);
    border-color: rgba(0, 255, 102, 0.55);
}
.tf-pill.active-tf .tf-label { color: var(--manga-green); }
.tf-pill.active-tf .tf-sub { color: #e2e8f0; }

.tf-pill.active-htf {
    background: rgba(255, 0, 127, 0.14);
    border-color: rgba(255, 0, 127, 0.65);
}
.tf-pill.active-htf .tf-label { color: #ff66b2; }
.tf-pill.active-htf .tf-sub { color: #fff; }

.val-up { color: var(--manga-green); }
.val-down { color: var(--manga-red); }

.chart-modal {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    background: rgba(4, 6, 14, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 4px;
    overflow: hidden;
    touch-action: pan-y;
}
.chart-modal.active { display: flex; }
.chart-box {
    width: 100%; max-width: 1200px;
    height: 100%; max-height: 100vh; max-height: 100dvh;
    background: #0b0f19;
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
    position: relative;
    transition: transform 0.15s ease-out;
}
.chart-header {
    padding: 6px 10px;
    background: #111726;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    gap: 4px;
    flex-shrink: 0;
    z-index: 2;
}
.header-title-group { display: flex; align-items: center; gap: 6px; }
.symbol-title { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 800; color: #fff; }
.symbol-rank-tag { font-size: 0.65rem; color: var(--manga-cyan); font-weight: 800; }
.legend-bar { display: flex; gap: 6px; font-size: 0.52rem; font-family: 'JetBrains Mono', monospace; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 2px; }
.legend-color { width: 5px; height: 5px; border-radius: 2px; }
.close-btn {
    background: rgba(255,255,255,0.08);
    color: #a0aec0;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 24px; height: 24px;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease;
    flex-shrink: 0;
}
.close-btn:hover { background: var(--manga-red); color: #fff; border-color: var(--manga-red); }
.nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--manga-cyan);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; cursor: pointer; z-index: 10;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
}
.nav-btn:hover { background: var(--manga-cyan); color: #000; box-shadow: 0 0 12px var(--manga-cyan); }
.nav-btn.prev { left: 4px; }
.nav-btn.next { right: 4px; }

.charts-wrapper {
    flex: 1;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    background: #060911;
    overflow: hidden;
    min-height: 0;
}
.charts-wrapper.single-view {
    display: block !important;
}
.charts-wrapper.single-view .chart-panel {
    display: none;
    width: 100%;
    height: 100%;
    border: none !important;
}
.charts-wrapper.single-view .chart-panel.active-single {
    display: block;
}

.chart-panel {
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    min-height: 0;
    cursor: pointer;
    transition: background-color 0.2s;
}
.chart-panel:hover { background: rgba(0, 240, 255, 0.03); }
.chart-panel:nth-child(2) { border-right: none; }
.chart-panel:nth-child(4) { border-right: none; }
.chart-panel:nth-child(3), .chart-panel:nth-child(4) { border-bottom: none; }

.panel-tag {
    position: absolute; top: 3px; left: 6px; z-index: 5;
    font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 800;
    padding: 1px 4px; border-radius: 3px;
    background: rgba(0,0,0,0.6); color: var(--manga-cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
    pointer-events: none;
}
canvas { display: block; width: 100%; height: 100%; }

@media (max-width: 600px) {
    .chart-modal { padding: 0; }
    .chart-box { max-height: 100vh; max-height: 100dvh; border-radius: 0; border: none; }
    .chart-header { padding: 4px 8px; }
    .symbol-title { font-size: 0.8rem; }
    .legend-bar { font-size: 0.45rem; gap: 3px; }
    .nav-btn { width: 28px; height: 28px; font-size: 0.9rem; opacity: 0.6; }
    .tab-btn { font-size: 0.55rem; padding: 6px 1px; }
}
</style>
</head>
<body>
<div class="app-header">
    <div class="header-top">
        <div class="header-title">
            ⚡ 多週期多頭排列儀表板 (成交額前200)
            <span class="source-tag">幣安 Binance</span>
        </div>
        <button id="scanBtn" class="scan-btn">啟動極速掃描</button>
    </div>
</div>
<div class="progress-container"><div id="progress" class="progress-fill"></div></div>
<div class="tab-container">
    <button id="tab15m" class="tab-btn active">⚡15M(<span id="count15m">0</span>)</button>
    <button id="tab1h" class="tab-btn">⚡1H(<span id="count1h">0</span>)</button>
    <button id="tab4h" class="tab-btn">⚡4H(<span id="count4h">0</span>)</button>
    <button id="tab1d" class="tab-btn">⚡1D(<span id="count1d">0</span>)</button>
    <button id="tabMulti" class="tab-btn">🔥共振(<span id="countMulti">0</span>)</button>
    <button id="tabLowRisk" class="tab-btn low-risk">⭐閃電精選(<span id="countLowRisk">0</span>)</button>
</div>
<div class="sort-bar">
    <span class="sort-label">排序：</span>
    <button id="sortVolume" class="sort-btn active" data-sort="volume">24H 成交額</button>
    <button id="sortMatch" class="sort-btn" data-sort="match">共振週期數</button>
    <button id="sortBias" class="sort-btn" data-sort="bias">60MA 乖離率</button>
</div>
<div class="dashboard">
    <div class="stat-card">
        <div class="val" id="statTotal" style="color:var(--manga-cyan)">0</div>
        <div style="font-size:0.75rem; color:#64748b; margin-top:2px;">幣安掃描目標數 (前200)</div>
    </div>
    <div class="stat-card entry">
        <div class="val" id="statEntry">0</div>
        <div style="font-size:0.75rem; color:#64748b; margin-top:2px;" id="statLabel">當前清單符合數</div>
    </div>
</div>
<div class="container" id="symbolList"></div>

<div id="chartModal" class="chart-modal" aria-hidden="true">
    <button id="prevBtn" class="nav-btn prev" aria-label="上一隻">❮</button>
    <button id="nextBtn" class="nav-btn next" aria-label="下一隻">❯</button>
    <div id="chartBox" class="chart-box" role="dialog" aria-modal="true">
        <div class="chart-header">
            <div class="header-title-group">
                <span id="symbolRankTag" class="symbol-rank-tag">#1</span>
                <div id="symbolTitle" class="symbol-title">BTCUSDT</div>
            </div>
            <div class="legend-bar">
                <div class="legend-item"><div class="legend-color" style="background:#00ff66"></div>5MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>30MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff9100"></div>45MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff007f"></div>60MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#00ff66"></div>5VM</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>20VM</div>
                <div class="legend-item"><div class="legend-color" style="background:#00f0ff"></div>MACD</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>Signal</div>
            </div>
            <button id="closeModalBtn" class="close-btn" aria-label="關閉">✕</button>
        </div>
        <div class="charts-wrapper" id="chartsWrapper">
            <div class="chart-panel" id="wrapper15m" data-period="15m">
                <span class="panel-tag" id="tagText15m">15M</span>
                <canvas id="klineCanvas15m"></canvas>
            </div>
            <div class="chart-panel" id="wrapper1h" data-period="1h">
                <span class="panel-tag" id="tagText1h">1H</span>
                <canvas id="klineCanvas1h"></canvas>
            </div>
            <div class="chart-panel" id="wrapper4h" data-period="4h">
                <span class="panel-tag" id="tagText4h">4H</span>
                <canvas id="klineCanvas4h"></canvas>
            </div>
            <div class="chart-panel" id="wrapper1d" data-period="1d">
                <span class="panel-tag" id="tagText1d">1D</span>
                <canvas id="klineCanvas1d"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    const EXCHANGE_NAME = '幣安 (Binance Futures)';
    const API_BASE = 'https://fapi.binance.com';
    const TOP_N = 200;
    const P0 = 5, P1 = 30, P2 = 45, P3 = 60;
    
    const COUNT_15M = 150;
    const COUNT_1H = 50;
    const COUNT_4H = 40;
    const COUNT_1D = 30;

    const FETCH_LIMIT_15M = COUNT_15M + P3 + 35;
    const FETCH_LIMIT_1H = COUNT_1H + P3 + 35;
    const FETCH_LIMIT_4H = COUNT_4H + P3 + 35;
    const FETCH_LIMIT_1D = COUNT_1D + P3 + 35;

    let results15M = [];
    let results1H = [];
    let results4H = [];
    let results1D = [];
    let resultsMulti = [];
    let resultsLowRisk = [];
    let activeTab = '15m';
    let sortMode = 'volume';
    let tickerMap = new Map();
    let currentIndex = -1;
    let maximizedPeriod = null;
    const klinesCache = new Map();

    const dom = {
        scanBtn: document.getElementById('scanBtn'),
        progress: document.getElementById('progress'),
        statTotal: document.getElementById('statTotal'),
        statEntry: document.getElementById('statEntry'),
        count15m: document.getElementById('count15m'),
        count1h: document.getElementById('count1h'),
        count4h: document.getElementById('count4h'),
        count1d: document.getElementById('count1d'),
        countMulti: document.getElementById('countMulti'),
        countLowRisk: document.getElementById('countLowRisk'),
        tab15m: document.getElementById('tab15m'),
        tab1h: document.getElementById('tab1h'),
        tab4h: document.getElementById('tab4h'),
        tab1d: document.getElementById('tab1d'),
        tabMulti: document.getElementById('tabMulti'),
        tabLowRisk: document.getElementById('tabLowRisk'),
        sortBtns: Array.from(document.querySelectorAll('.sort-btn')),
        symbolList: document.getElementById('symbolList'),
        chartModal: document.getElementById('chartModal'),
        symbolTitle: document.getElementById('symbolTitle'),
        symbolRankTag: document.getElementById('symbolRankTag'),
        closeModalBtn: document.getElementById('closeModalBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        chartsWrapper: document.getElementById('chartsWrapper'),
        wrapper15m: document.getElementById('wrapper15m'),
        wrapper1h: document.getElementById('wrapper1h'),
        wrapper4h: document.getElementById('wrapper4h'),
        wrapper1d: document.getElementById('wrapper1d'),
        canvas15m: document.getElementById('klineCanvas15m'),
        canvas1h: document.getElementById('klineCanvas1h'),
        canvas4h: document.getElementById('klineCanvas4h'),
        canvas1d: document.getElementById('klineCanvas1d'),
        tagText15m: document.getElementById('tagText15m'),
        tagText1h: document.getElementById('tagText1h'),
        tagText4h: document.getElementById('tagText4h'),
        tagText1d: document.getElementById('tagText1d')
    };

    const ctx15m = dom.canvas15m.getContext('2d');
    const ctx1h = dom.canvas1h.getContext('2d');
    const ctx4h = dom.canvas4h.getContext('2d');
    const ctx1d = dom.canvas1d.getContext('2d');

    function calculateSMA(data, period) {
        const len = data.length;
        if (len < period) return new Array(len).fill(null);
        const ma = new Array(len).fill(null);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += data[i] - data[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }

    function calculateEMA(data, period) {
        const len = data.length;
        const ema = new Array(len).fill(null);
        if (len === 0) return ema;
        const multiplier = 2 / (period + 1);
        let sum = 0;
        let initCount = Math.min(period, len);
        for (let i = 0; i < initCount; i++) sum += data[i];
        let prevEMA = sum / initCount;
        ema[initCount - 1] = prevEMA;
        for (let i = initCount; i < len; i++) {
            prevEMA = (data[i] - prevEMA) * multiplier + prevEMA;
            ema[i] = prevEMA;
        }
        return ema;
    }

    function calculateMACD(closes, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
        const fastEMA = calculateEMA(closes, fastPeriod);
        const slowEMA = calculateEMA(closes, slowPeriod);
        const macdLine = new Array(closes.length).fill(null);
        for (let i = 0; i < closes.length; i++) {
            if (fastEMA[i] !== null && slowEMA[i] !== null) {
                macdLine[i] = fastEMA[i] - slowEMA[i];
            }
        }
        const validMacdSubset = [];
        const validIndices = [];
        for (let i = 0; i < macdLine.length; i++) {
            if (macdLine[i] !== null) {
                validMacdSubset.push(macdLine[i]);
                validIndices.push(i);
            }
        }
        const signalSubset = calculateEMA(validMacdSubset, signalPeriod);
        const signalLine = new Array(closes.length).fill(null);
        const histogram = new Array(closes.length).fill(null);
        for (let j = 0; j < validIndices.length; j++) {
            const origIdx = validIndices[j];
            const sigVal = signalSubset[j];
            signalLine[origIdx] = sigVal;
            if (sigVal !== null) {
                histogram[origIdx] = macdLine[origIdx] - sigVal;
            }
        }
        return { macdLine, signalLine, histogram };
    }

    function formatVolumeText(volume) {
        const yi = volume / 100000000;
        return yi.toFixed(2) + '億';
    }

    function getMaxMa60Bias(item) {
        const values = [
            item.bull15m?.ma3DistPercent,
            item.bull1h?.ma3DistPercent,
            item.bull4h?.ma3DistPercent,
            item.bull1d?.ma3DistPercent
        ].filter(v => typeof v === 'number' && !Number.isNaN(v));
        return values.length > 0 ? Math.max(...values) : -Infinity;
    }

    function sortItems(list) {
        const copy = list.slice();
        if (sortMode === 'match') {
            copy.sort((a, b) => (b.matchCount - a.matchCount) || (b.quoteVolume24h - a.quoteVolume24h));
        } else if (sortMode === 'bias') {
            copy.sort((a, b) => (getMaxMa60Bias(b) - getMaxMa60Bias(a)) || (b.quoteVolume24h - a.quoteVolume24h));
        } else {
            copy.sort((a, b) => b.quoteVolume24h - a.quoteVolume24h);
        }
        return copy;
    }

    const workerCode = `
    function calculateSMA(data, period) {
        const len = data.length;
        if (len < period) return new Array(len).fill(null);
        const ma = new Array(len).fill(null);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += data[i] - data[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }
    function checkAboveMAs5_30_45_60(closes, ma5, ma30, ma45, ma60, idx) {
        if (idx < 0 || idx >= closes.length) return false;
        const price = closes[idx];
        return (ma5[idx] !== null && price >= ma5[idx]) &&
               (ma30[idx] !== null && price >= ma30[idx]) &&
               (ma45[idx] !== null && price >= ma45[idx]) &&
               (ma60[idx] !== null && price >= ma60[idx]);
    }
    function checkAboveMAs30_45_60(closes, ma30, ma45, ma60, idx) {
        if (idx < 0 || idx >= closes.length) return false;
        const price = closes[idx];
        const m30 = ma30[idx], m45 = ma45[idx], m60 = ma60[idx];
        return (m30 !== null && price >= m30) && (m45 !== null && price >= m45) && (m60 !== null && price >= m60);
    }
    function checkIsFirstBarLightning(klinesRaw, useMA5) {
        const totalLen = klinesRaw.length;
        if (totalLen < 60) return false;
        const closes = klinesRaw.map(k => parseFloat(k[4]));
        const ma1Arr = calculateSMA(closes, 30);
        const ma2Arr = calculateSMA(closes, 45);
        const ma3Arr = calculateSMA(closes, 60);
        const ma5Arr = calculateSMA(closes, 5);

        const nowIdx = totalLen - 1;
        const prevIdx = totalLen - 2;

        let isNowAbove = false;
        let isPrevAbove = false;

        if (useMA5) {
            isNowAbove = checkAboveMAs5_30_45_60(closes, ma5Arr, ma1Arr, ma2Arr, ma3Arr, nowIdx);
            isPrevAbove = checkAboveMAs5_30_45_60(closes, ma5Arr, ma1Arr, ma2Arr, ma3Arr, prevIdx);
        } else {
            isNowAbove = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, nowIdx);
            isPrevAbove = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, prevIdx);
        }

        return isNowAbove && !isPrevAbove;
    }

    function isBullishAlignment(klinesRaw) {
        const totalLen = klinesRaw.length;
        if (totalLen < 60) return null;
        const closes = klinesRaw.map(k => parseFloat(k[4]));
        const price = closes[totalLen - 1];
        const ma1Arr = calculateSMA(closes, 30);
        const ma2Arr = calculateSMA(closes, 45);
        const ma3Arr = calculateSMA(closes, 60);
        const ma1 = ma1Arr[totalLen - 1];
        const ma2 = ma2Arr[totalLen - 1];
        const ma3 = ma3Arr[totalLen - 1];
        if (ma1 !== null && ma2 !== null && ma3 !== null && ma1 > ma2 && ma2 > ma3 && price >= ma3) {
            const ma3DistPercent = ((price - ma3) / ma3) * 100;
            const isAboveAllNow = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, totalLen - 1);
            const isAboveAllPrev = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, totalLen - 2);
            const isFirstBarAboveAll = isAboveAllNow && !isAboveAllPrev;
            return { price, ma3DistPercent, isAboveAllMAs: isAboveAllNow, isFirstBarAboveAll };
        }
        return null;
    }

    async function fetchWithRetry(url, retries = 3, delay = 500) {
        for (let i = 0; i < retries; i++) {
            try {
                const res = await fetch(url);
                if (res.status === 429 || res.status === 418) {
                    await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
                    continue;
                }
                if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
                return await res.json();
            } catch (err) {
                if (i === retries - 1) throw err;
                await new Promise(r => setTimeout(r, delay));
            }
        }
        throw new Error('Max retries exceeded');
    }

    async function fetchSymbol(symbol, apiBase, limits) {
        try {
            const [klines15m, klines1h, klines4h, klines1d] = await Promise.all([
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=15m&limit=\${limits.l15m}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=1h&limit=\${limits.l1h}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=4h&limit=\${limits.l4h}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=1d&limit=\${limits.l1d}\`)
            ]);

            const bull15m = isBullishAlignment(klines15m);
            const bull1h = isBullishAlignment(klines1h);
            const bull4hReal = isBullishAlignment(klines4h);
            const bull1dReal = isBullishAlignment(klines1d);

            if (!bull15m && !bull1h && !bull4hReal && !bull1dReal) return null;
            let matchCount = 0;
            if (bull15m) matchCount++;
            if (bull1h) matchCount++;
            if (bull4hReal) matchCount++;
            if (bull1dReal) matchCount++;

            const lightning1h = checkIsFirstBarLightning(klines1h, true);
            const lightning4h = checkIsFirstBarLightning(klines4h, true);
            const lightning1d = checkIsFirstBarLightning(klines1d, true);

            const isLightningMatch = lightning1h || lightning4h || lightning1d;

            let lightningType = '';
            if (lightning1d) lightningType = '1D';
            else if (lightning4h) lightningType = '4H';
            else if (lightning1h) lightningType = '1H';

            return {
                symbol, bull15m, bull1h, bull4h: bull4hReal, bull1d: bull1dReal, matchCount,
                isLightningMatch, lightningType,
                currentPrice: (bull15m || bull1h || bull4hReal || bull1dReal).price,
                rawKlines: { k15m: klines15m, k1h: klines1h, k4h: klines4h, k1d: klines1d }
            };
        } catch {
            return null;
        }
    }

    self.onmessage = async function(e) {
        const { symbols, apiBase, limits } = e.data;
        const concurrency = 8;
        let completed = 0;
        const matches = [];

        for (let i = 0; i < symbols.length; i += concurrency) {
            const chunk = symbols.slice(i, i + concurrency);
            const chunkResults = await Promise.all(chunk.map(sym => fetchSymbol(sym, apiBase, limits)));
            chunkResults.filter(Boolean).forEach(res => matches.push(res));
            completed += chunk.length;
            self.postMessage({ type: 'progress', completed, total: symbols.length });
            await new Promise(r => setTimeout(r, 50));
        }
        self.postMessage({ type: 'done', matches });
    };
    `;

    async function startScan() {
        dom.scanBtn.disabled = true;
        dom.scanBtn.innerText = "⚡ 幣安背景掃描中...";
        dom.symbolList.replaceChildren();
        dom.progress.style.width = '0%';
        klinesCache.clear();

        let allTickers = [];
        try {
            const res = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`);
            if (res.ok) {
                const data = await res.json();
                tickerMap.clear();
                data.forEach(d => tickerMap.set(d.symbol, d));
                allTickers = data;
            }
        } catch {
            alert(`無法取得 ${EXCHANGE_NAME} 行情數據，請檢查網路連線。`);
            dom.scanBtn.disabled = false;
            dom.scanBtn.innerText = "啟動極速掃描";
            return;
        }

        const candidateSymbols = allTickers
            .filter(d => d.symbol.endsWith('USDT'))
            .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
            .slice(0, TOP_N)
            .map(d => d.symbol);

        dom.statTotal.innerText = candidateSymbols.length;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const blobUrl = URL.createObjectURL(blob);
        const worker = new Worker(blobUrl);
        URL.revokeObjectURL(blobUrl);

        worker.postMessage({
            symbols: candidateSymbols,
            apiBase: API_BASE,
            limits: { l15m: FETCH_LIMIT_15M, l1h: FETCH_LIMIT_1H, l4h: FETCH_LIMIT_4H, l1d: FETCH_LIMIT_1D }
        });

        worker.onmessage = (e) => {
            const { type, completed, total, matches } = e.data;
            if (type === 'progress') {
                dom.progress.style.width = `${(completed / total) * 100}%`;
            } else if (type === 'done') {
                worker.terminate();
                const allMatches = matches.map(m => {
                    const ticker = tickerMap.get(m.symbol);
                    klinesCache.set(m.symbol, m.rawKlines);
                    return {
                        symbol: m.symbol,
                        price: m.currentPrice,
                        bull15m: m.bull15m,
                        bull1h: m.bull1h,
                        bull4h: m.bull4h,
                        bull1d: m.bull1d,
                        matchCount: m.matchCount,
                        isLightningMatch: m.isLightningMatch,
                        lightningType: m.lightningType,
                        priceChange24h: ticker ? parseFloat(ticker.priceChangePercent) : 0,
                        quoteVolume24h: ticker ? parseFloat(ticker.quoteVolume) : 0
                    };
                });

                results15M = allMatches.filter(m => m.bull15m);
                results1H = allMatches.filter(m => m.bull1h);
                results4H = allMatches.filter(m => m.bull4h);
                results1D = allMatches.filter(m => m.bull1d);
                resultsMulti = allMatches.filter(m => m.matchCount >= 2);
                resultsLowRisk = allMatches.filter(m => m.isLightningMatch);

                dom.count15m.innerText = results15M.length;
                dom.count1h.innerText = results1H.length;
                dom.count4h.innerText = results4H.length;
                dom.count1d.innerText = results1D.length;
                dom.countMulti.innerText = resultsMulti.length;
                dom.countLowRisk.innerText = resultsLowRisk.length;

                dom.scanBtn.disabled = false;
                dom.scanBtn.innerText = "啟動極速掃描";
                renderList();
            }
        };
    }

    function getCurrentList() {
        let baseList = [];

<!DOCTYPE html> 
<html lang="zh-TW"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
<title>⚡ 多週期多頭排列選股儀表板 (>1億USDT)</title> 
<style> 
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@700;800;900&display=swap'); 
:root { 
  --bg-dark: #060911; 
  --card-bg: rgba(15, 23, 42, 0.75); 
  --border-color: rgba(0, 240, 255, 0.25); 
  --manga-pink: #ff007f; 
  --manga-purple: #9d4edd; 
  --manga-cyan: #00f0ff; 
  --manga-yellow: #ffea00; 
  --manga-orange: #ff9100; 
  --manga-green: #00ff66; 
  --manga-red: #ff2a6d; 
} 
* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; } 
body { 
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
  background-color: var(--bg-dark); 
  background-image: radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.12) 0px, transparent 50%), 
                    radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.12) 0px, transparent 50%), 
                    radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); 
  background-size: 100% 100%, 100% 100%, 20px 20px; 
  color: #fff; margin: 0; padding-bottom: 50px; min-height: 100vh; 
} 
body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }

.app-header { 
  position: sticky; top: 0; z-index: 100; background: rgba(8, 12, 22, 0.88); 
  backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); 
  padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); 
} 
.header-top { display: flex; justify-content: space-between; align-items: center; } 
.header-title { 
  font-size: 1.1rem; font-weight: 900; letter-spacing: -0.5px; 
  background: linear-gradient(135deg, #fff 30%, var(--manga-cyan)); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 6px; 
} 
.scan-btn { 
  background: linear-gradient(135deg, var(--manga-pink) 0%, #ff5500 100%); 
  color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 0.85rem; cursor: pointer; 
  box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); transition: transform 0.15s ease, filter 0.2s ease; 
  will-change: transform;
} 
.scan-btn:active { transform: scale(0.95); } 
.scan-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; } 
.progress-container { height: 3px; background: rgba(255, 255, 255, 0.05); width: 100%; } 
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--manga-pink), var(--manga-cyan)); transition: width 0.1s linear; } 

.tab-container {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 16px; margin-top: 12px;
}
.tab-btn {
  padding: 8px 4px; border-radius: 8px; font-weight: 800; font-size: 0.75rem;
  background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
  color: #94a3b8; cursor: pointer; text-align: center; transition: all 0.2s ease;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab-btn.active {
  background: rgba(0, 240, 255, 0.15); border-color: var(--manga-cyan);
  color: #fff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
}

.dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; } 
.stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; backdrop-filter: blur(10px); } 
.stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800; } 
.stat-card.entry { border-color: rgba(255, 0, 127, 0.4); } 
.stat-card.entry .val { color: var(--manga-pink); text-shadow: 0 0 10px rgba(255, 0, 127, 0.3); } 
.container { padding: 0 16px; } 

.symbol-card { 
  background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-left: 4px solid var(--manga-green); border-radius: 12px; 
  padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); 
  cursor: pointer; transition: border-color 0.2s, transform 0.2s, background-color 0.2s; 
  will-change: transform;
} 
.symbol-card:hover { border-color: var(--manga-cyan); background: rgba(0, 240, 255, 0.08); transform: translateY(-2px); } 
.symbol-card:active { transform: scale(0.98); }
.symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; } 
.symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); font-weight: 700; } 
.detail-row { font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; margin-top: 4px; } 

.badge-rank { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 255, 255, 0.1); color: #fff; } 
.badge-bull { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(0, 255, 102, 0.15); color: var(--manga-green); border: 1px solid var(--manga-green); }
.badge-multi { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; background: rgba(255, 0, 127, 0.15); color: var(--manga-pink); border: 1px solid var(--manga-pink); }
.val-up { color: var(--manga-green); } 
.val-down { color: var(--manga-red); } 

.chart-modal {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
  background: rgba(4, 6, 14, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 1000; display: none; justify-content: center; align-items: center; padding: 8px;
  overflow: hidden; touch-action: pan-y;
}
.chart-modal.active { display: flex; }
.chart-box {
  width: 100%; max-width: 1050px; height: 100%; max-height: 98vh; max-height: 98dvh; background: #0b0f19;
  border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
  position: relative; transition: transform 0.15s ease-out;
}

.chart-header {
  padding: 8px 12px; background: #111726; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.08); gap: 6px; flex-shrink: 0; z-index: 2;
}

.header-title-group { display: flex; align-items: center; gap: 6px; }
.symbol-title { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800; color: #fff; }
.symbol-rank-tag { font-size: 0.7rem; color: var(--manga-cyan); font-weight: 800; }

.legend-bar { display: flex; gap: 6px; font-size: 0.65rem; font-family: 'JetBrains Mono', monospace; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 3px; }
.legend-color { width: 6px; height: 6px; border-radius: 2px; }

.close-btn {
  background: rgba(255,255,255,0.08); color: #a0aec0; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
  width: 28px; height: 28px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background-color 0.15s ease; flex-shrink: 0;
}
.close-btn:hover { background: var(--manga-red); color: #fff; border-color: var(--manga-red); }

.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--manga-cyan);
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; cursor: pointer; z-index: 10; backdrop-filter: blur(4px);
  transition: all 0.2s ease;
}
.nav-btn:hover { background: var(--manga-cyan); color: #000; box-shadow: 0 0 12px var(--manga-cyan); }
.nav-btn.prev { left: 8px; }
.nav-btn.next { right: 8px; }

.charts-wrapper { flex: 1; width: 100%; height: 100%; display: flex; flex-direction: column; background: #060911; overflow: hidden; }
.chart-panel { 
  flex: 1; width: 100%; position: relative; border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
  transition: flex 0.25s ease, height 0.25s ease; cursor: pointer;
}
.chart-panel:last-child { border-bottom: none; }
.chart-panel.minimized { flex: 0 0 0px !important; height: 0 !important; border-bottom: none; overflow: hidden; }
.chart-panel.maximized { flex: 1 1 100% !important; height: 100% !important; }

.panel-tag {
  position: absolute; top: 4px; left: 8px; z-index: 5;
  font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; font-weight: 800;
  padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.6); color: var(--manga-cyan);
  border: 1px solid rgba(0, 240, 255, 0.3); pointer-events: none;
}
canvas { display: block; width: 100%; height: 100%; }

@media (max-width: 600px) {
  .chart-modal { padding: 0; }
  .chart-box { max-height: 100vh; max-height: 100dvh; border-radius: 0; border: none; }
  .chart-header { padding: 6px 10px; }
  .symbol-title { font-size: 0.85rem; }
  .legend-bar { font-size: 0.6rem; gap: 4px; }
  .nav-btn { width: 32px; height: 32px; font-size: 1rem; opacity: 0.6; }
  .tab-btn { font-size: 0.65rem; padding: 6px 2px; }
}
</style> 
</head> 
<body> 

<div class="app-header"> 
  <div class="header-top"> 
    <div class="header-title">⚡ 多週期多頭排列儀表板 (>1億USDT)</div> 
    <button id="scanBtn" class="scan-btn">啟動極速掃描</button> 
  </div> 
</div> 
<div class="progress-container"><div id="progress" class="progress-fill"></div></div> 

<div class="tab-container">
  <button id="tab15m" class="tab-btn active">⚡ 15M 多頭 (<span id="count15m">0</span>)</button>
  <button id="tab1h" class="tab-btn">⚡ 1H 多頭 (<span id="count1h">0</span>)</button>
  <button id="tab4h" class="tab-btn">⚡ 4H 多頭 (<span id="count4h">0</span>)</button>
  <button id="tabMulti" class="tab-btn">🔥 共振(≥2) (<span id="countMulti">0</span>)</button>
</div>

<div class="dashboard"> 
  <div class="stat-card"> 
    <div class="val" id="statTotal" style="color:var(--manga-cyan)">0</div> 
    <div style="font-size:0.75rem; color:#64748b; margin-top:2px;">掃描目標數 (>1億USDT)</div> 
  </div> 
  <div class="stat-card entry"> 
    <div class="val" id="statEntry">0</div> 
    <div style="font-size:0.75rem; color:#64748b; margin-top:2px;" id="statLabel">當前清單符合數</div> 
  </div> 
</div> 

<div class="container" id="symbolList"></div> 

<div id="chartModal" class="chart-modal" aria-hidden="true">
  <button id="prevBtn" class="nav-btn prev" aria-label="上一隻">❮</button>
  <button id="nextBtn" class="nav-btn next" aria-label="下一隻">❯</button>
  
  <div id="chartBox" class="chart-box" role="dialog" aria-modal="true">
    <div class="chart-header">
      <div class="header-title-group">
        <span id="symbolRankTag" class="symbol-rank-tag">#1</span>
        <div id="symbolTitle" class="symbol-title">BTCUSDT</div>
      </div>
      <div class="legend-bar">
        <div class="legend-item"><div class="legend-color" style="background:#00ff66"></div>5MA</div>
        <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>30MA</div>
        <div class="legend-item"><div class="legend-color" style="background:#ff9100"></div>45MA</div>
        <div class="legend-item"><div class="legend-color" style="background:#ff007f"></div>60MA</div>
        <div class="legend-item"><div class="legend-color" style="background:#00f0ff"></div>5VM</div>
        <div class="legend-item"><div class="legend-color" style="background:#9d4edd"></div>10VM</div>
      </div>
      <button id="closeModalBtn" class="close-btn" aria-label="關閉">✕</button>
    </div>

    <div class="charts-wrapper" id="chartsWrapper">
      <div class="chart-panel" id="wrapper15m" data-period="15m">
        <span class="panel-tag" id="tagText15m">15M 時間框架 (100根)</span>
        <canvas id="klineCanvas15m"></canvas>
      </div>
      <div class="chart-panel" id="wrapper1h" data-period="1h">
        <span class="panel-tag" id="tagText1h">1H 時間框架 (80根)</span>
        <canvas id="klineCanvas1h"></canvas>
      </div>
      <div class="chart-panel" id="wrapper4h" data-period="4h">
        <span class="panel-tag" id="tagText4h">4H 時間框架 (60根)</span>
        <canvas id="klineCanvas4h"></canvas>
      </div>
    </div>
  </div>
</div>

<script> 
(() => {
  const API_BASE = 'https://fapi.binance.com'; 
  const P0 = 5, P1 = 30, P2 = 45, P3 = 60; 
  const MIN_VOLUME = 100000000;
  const CONCURRENCY_LIMIT = 15;

  const COUNT_15M = 100;
  const COUNT_1H = 80;
  const COUNT_4H = 60;

  const FETCH_LIMIT = P3 + 60; 

  let results15M = [];
  let results1H = []; 
  let results4H = []; 
  let resultsMulti = []; 
  let activeTab = '15m';

  let tickerMap = new Map(); 
  let currentIndex = -1; 
  let maximizedPeriod = null; 

  const dom = {
    scanBtn: document.getElementById('scanBtn'),
    progress: document.getElementById('progress'),
    statTotal: document.getElementById('statTotal'),
    statEntry: document.getElementById('statEntry'),
    count15m: document.getElementById('count15m'),
    count1h: document.getElementById('count1h'),
    count4h: document.getElementById('count4h'),
    countMulti: document.getElementById('countMulti'),
    tab15m: document.getElementById('tab15m'),
    tab1h: document.getElementById('tab1h'),
    tab4h: document.getElementById('tab4h'),
    tabMulti: document.getElementById('tabMulti'),
    symbolList: document.getElementById('symbolList'),
    chartModal: document.getElementById('chartModal'),
    symbolTitle: document.getElementById('symbolTitle'),
    symbolRankTag: document.getElementById('symbolRankTag'),
    closeModalBtn: document.getElementById('closeModalBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    chartsWrapper: document.getElementById('chartsWrapper'),
    wrapper15m: document.getElementById('wrapper15m'),
    wrapper1h: document.getElementById('wrapper1h'),
    wrapper4h: document.getElementById('wrapper4h'),
    canvas15m: document.getElementById('klineCanvas15m'),
    canvas1h: document.getElementById('klineCanvas1h'),
    canvas4h: document.getElementById('klineCanvas4h'),
    tagText15m: document.getElementById('tagText15m'),
    tagText1h: document.getElementById('tagText1h'),
    tagText4h: document.getElementById('tagText4h')
  };

  const ctx15m = dom.canvas15m.getContext('2d');
  const ctx1h = dom.canvas1h.getContext('2d');
  const ctx4h = dom.canvas4h.getContext('2d');

  function calculateSMA(data, period) { 
    const len = data.length; 
    if (len < period) return new Array(len).fill(null); 
    const ma = new Array(len).fill(null); 
    let sum = 0; 
    for (let i = 0; i < period; i++) sum += data[i]; 
    ma[period - 1] = sum / period; 
    for (let i = period; i < len; i++) { 
      sum += data[i] - data[i - period]; 
      ma[i] = sum / period; 
    } 
    return ma; 
  } 

  function checkAboveAllMAsAtIndex(closes, ma5, ma30, ma45, ma60, idx) {
    if (idx < 0 || idx >= closes.length) return false;
    const price = closes[idx];
    const m5 = ma5[idx], m30 = ma30[idx], m45 = ma45[idx], m60 = ma60[idx];
    
    return (m5 !== null && price >= m5) && 
           (m30 !== null && price >= m30) && 
           (m45 !== null && price >= m45) && 
           (m60 !== null && price >= m60);
  }

  function isBullishAlignment(klinesRaw) {
    const totalLen = klinesRaw.length;
    if (totalLen < P3) return null;

    const closes = klinesRaw.map(k => parseFloat(k[4]));
    const price = closes[totalLen - 1];

    const ma5Arr = calculateSMA(closes, P0);
    const ma1Arr = calculateSMA(closes, P1);
    const ma2Arr = calculateSMA(closes, P2);
    const ma3Arr = calculateSMA(closes, P3);

    const ma1 = ma1Arr[totalLen - 1];
    const ma2 = ma2Arr[totalLen - 1];
    const ma3 = ma3Arr[totalLen - 1];

    if (ma1 !== null && ma2 !== null && ma3 !== null && ma1 > ma2 && ma2 > ma3 && price >= ma3) {
      const ma3DistPercent = ((price - ma3) / ma3) * 100;
      const isAboveAllNow = checkAboveAllMAsAtIndex(closes, ma5Arr, ma1Arr, ma2Arr, ma3Arr, totalLen - 1);
      const isAboveAllPrev = checkAboveAllMAsAtIndex(closes, ma5Arr, ma1Arr, ma2Arr, ma3Arr, totalLen - 2);
      const isFirstBarAboveAll = isAboveAllNow && !isAboveAllPrev;

      return { price, ma3DistPercent, isAboveAllMAs: isAboveAllNow, isFirstBarAboveAll };
    }
    return null;
  }

  async function fetchSymbolDetailsData(symbol, signal) { 
    try {
      const [res15m, res1h, res4h] = await Promise.all([
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=${FETCH_LIMIT}`, { signal }),
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${FETCH_LIMIT}`, { signal }),
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=4h&limit=${FETCH_LIMIT}`, { signal })
      ]);

      if (!res15m.ok || !res1h.ok || !res4h.ok) return null;

      const klines15m = await res15m.json();
      const klines1h = await res1h.json();
      const klines4h = await res4h.json();

      const bull15m = isBullishAlignment(klines15m);
      const bull1h = isBullishAlignment(klines1h);
      const bull4h = isBullishAlignment(klines4h);

      if (!bull15m && !bull1h && !bull4h) return null;

      let matchCount = 0;
      if (bull15m) matchCount++;
      if (bull1h) matchCount++;
      if (bull4h) matchCount++;

      const ticker = tickerMap.get(symbol);
      const priceChange24h = ticker ? parseFloat(ticker.priceChangePercent) : 0; 
      const currentPrice = (bull15m || bull1h || bull4h).price;

      return { 
        symbol, 
        price: currentPrice, 
        bull15m,
        bull1h,
        bull4h,
        matchCount,
        priceChange24h 
      }; 
    } catch {
      return null;
    }
  } 

  async function batchProcess(items, limit, fn, onProgress) {
    const results = [];
    let completed = 0;
    
    for (let i = 0; i < items.length; i += limit) {
      const chunk = items.slice(i, i + limit);
      const chunkResults = await Promise.all(chunk.map(item => fn(item)));
      results.push(...chunkResults.filter(Boolean));
      completed += chunk.length;
      if (onProgress) onProgress(completed);
    }
    return results;
  }

  async function startScan() { 
    dom.scanBtn.disabled = true; 
    dom.scanBtn.innerText = "⚡ 掃描中..."; 
    dom.symbolList.replaceChildren(); 
    dom.progress.style.width = '0%';

    try {
      const res = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`); 
      if (res.ok) { 
        const data = await res.json(); 
        tickerMap.clear(); 
        data.forEach(d => tickerMap.set(d.symbol, d)); 
      } 
    } catch {
      alert("無法取得行情數據，請檢查網路連線。");
      dom.scanBtn.disabled = false;
      dom.scanBtn.innerText = "啟動極速掃描";
      return;
    }

    const candidateSymbols = Array.from(tickerMap.keys()).filter(sym => { 
      if (!sym.endsWith('USDT')) return false; 
      return parseFloat(tickerMap.get(sym).quoteVolume) > MIN_VOLUME; 
    }); 

    dom.statTotal.innerText = candidateSymbols.length; 

    const allMatches = await batchProcess(candidateSymbols, CONCURRENCY_LIMIT, (sym) => fetchSymbolDetailsData(sym), (completed) => {
      dom.progress.style.width = `${(completed / candidateSymbols.length) * 100}%`; 
    });

    results15M = allMatches.filter(m => m.bull15m);
    results1H = allMatches.filter(m => m.bull1h);
    results4H = allMatches.filter(m => m.bull4h);
    resultsMulti = allMatches.filter(m => m.matchCount >= 2);

    results15M.sort((a, b) => a.bull15m.ma3DistPercent - b.bull15m.ma3DistPercent);
    results1H.sort((a, b) => a.bull1h.ma3DistPercent - b.bull1h.ma3DistPercent);
    results4H.sort((a, b) => a.bull4h.ma3DistPercent - b.bull4h.ma3DistPercent);
    resultsMulti.sort((a, b) => b.matchCount - a.matchCount);

    dom.count15m.innerText = results15M.length;
    dom.count1h.innerText = results1H.length;
    dom.count4h.innerText = results4H.length;
    dom.countMulti.innerText = resultsMulti.length;

    dom.scanBtn.disabled = false; 
    dom.scanBtn.innerText = "啟動極速掃描"; 
    renderList(); 
  } 

  function getCurrentList() {
    switch (activeTab) {
      case '15m': return results15M;
      case '1h': return results1H;
      case '4h': return results4H;
      case 'multi': return resultsMulti;
      default: return [];
    }
  }

  function renderList() { 
    const currentList = getCurrentList();
    dom.statEntry.innerText = currentList.length;

    if (currentList.length === 0) { 
      dom.symbolList.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; font-weight:800;">目前無符合該條件之標的</div>`; 
      return; 
    } 
    
    const fragment = document.createDocumentFragment(); 
    currentList.forEach((item, index) => { 
      const card = document.createElement('div'); 
      card.className = 'symbol-card'; 
      card.addEventListener('click', () => openChartModal(index)); 

      const chg24Class = item.priceChange24h >= 0 ? 'val-up' : 'val-down'; 
      const chg24Sign = item.priceChange24h >= 0 ? '+' : ''; 

      let matchBadges = [];
      if (item.bull15m) matchBadges.push("15M");
      if (item.bull1h) matchBadges.push("1H");
      if (item.bull4h) matchBadges.push("4H");

      const badgeHtml = item.matchCount >= 2 
        ? `<span class="badge-multi">🔥 ${item.matchCount}週期共振 (${matchBadges.join('+')})</span>`
        : `<span class="badge-bull">⚡ ${matchBadges.join('/')} 多頭</span>`;

      let distText = '';
      if (activeTab === '15m' && item.bull15m) {
        distText = `距 15M 60MA: <span class="val-up">+${item.bull15m.ma3DistPercent.toFixed(2)}%</span>`;
      } else if (activeTab === '1h' && item.bull1h) {
        distText = `距 1H 60MA: <span class="val-up">+${item.bull1h.ma3DistPercent.toFixed(2)}%</span>`;
      } else if (activeTab === '4h' && item.bull4h) {
        distText = `距 4H 60MA: <span class="val-up">+${item.bull4h.ma3DistPercent.toFixed(2)}%</span>`;
      } else {
        distText = `滿足週期: <span class="val-up">${matchBadges.join(', ')}</span>`;
      }

      card.innerHTML = ` 
        <div style="flex: 1;"> 
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"> 
            <span class="badge-rank">#${index + 1}</span> 
            <span class="symbol-name">${item.symbol.replace('USDT','')}</span> 
            ${badgeHtml}
          </div> 
          <div class="detail-row"> ${distText} </div> 
          <div class="detail-row"> 
            24H 漲跌幅: <span class="${chg24Class}">${chg24Sign}${item.priceChange24h.toFixed(2)}%</span> 
          </div> 
        </div> 
        <div style="text-align:right;"> 
          <div class="symbol-price">${item.price}</div> 
          <div style="font-size:0.7rem; color:var(--manga-cyan); margin-top:4px;">點擊看 3 圖表 📈</div>
        </div> 
      `; 
      fragment.appendChild(card); 
    }); 
    dom.symbolList.replaceChildren(fragment); 
  } 

  let activeChartController = null;

  function renderCanvasChart(canvas, wrapper, ctx, klinesRaw, showCount, period, rocketIndices = new Set()) {
    const closesAll = klinesRaw.map(k => parseFloat(k[4]));
    const volumesAll = klinesRaw.map(k => parseFloat(k[5]));

    const ma5All = calculateSMA(closesAll, P0);
    const ma30All = calculateSMA(closesAll, P1);
    const ma45All = calculateSMA(closesAll, P2);
    const ma60All = calculateSMA(closesAll, P3);

    const vm5All = calculateSMA(volumesAll, 5);
    const vm10All = calculateSMA(volumesAll, 10);

    const actualShowCount = Math.min(showCount, klinesRaw.length);
    const showStartIndex = klinesRaw.length - actualShowCount;
    
    const showK = klinesRaw.slice(-actualShowCount);
    
    const showMA5 = ma5All.slice(-actualShowCount);
    const showMA30 = ma30All.slice(-actualShowCount);
    const showMA45 = ma45All.slice(-actualShowCount);
    const showMA60 = ma60All.slice(-actualShowCount);
    const showVM5 = vm5All.slice(-actualShowCount);
    const showVM10 = vm10All.slice(-actualShowCount);

    const rect = wrapper.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;

    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const width = rect.width;
    const height = rect.height;

    const padding = { top: 24, bottom: 8, left: 10, right: 65 };
    const totalH = height - padding.top - padding.bottom;
    
    const priceH = totalH * 0.62;
    const volH = totalH * 0.28;
    const volTop = padding.top + priceH + totalH * 0.08;

    const chartW = width - padding.left - padding.right;

    let minP = Infinity, maxP = -Infinity;
    showK.forEach(k => {
      const l = parseFloat(k[3]), h = parseFloat(k[2]);
      if (l < minP) minP = l;
      if (h > maxP) maxP = h;
    });

    let maxVol = -Infinity;
    showK.forEach(k => {
      const v = parseFloat(k[5]);
      if (v > maxVol) maxVol = v;
    });

    const priceRange = maxP - minP || 1;
    const getYPrice = (p) => padding.top + priceH - ((p - minP) / priceRange) * priceH;
    const getYVol = (v) => volTop + volH - (v / (maxVol || 1)) * volH;
    const barWidth = chartW / actualShowCount;

    ctx.clearRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fillStyle = '#64748b';
    ctx.font = '9px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.lineWidth = 1;

    const gridLines = 2;
    for (let i = 0; i <= gridLines; i++) {
      const y = padding.top + (priceH / gridLines) * i;
      const pVal = maxP - (priceRange / gridLines) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(width - padding.right, y);
      ctx.stroke();
      ctx.fillText(pVal.toFixed(2), width - padding.right + 4, y + 3);
    }

    ctx.beginPath();
    ctx.moveTo(padding.left, volTop);
    ctx.lineTo(width - padding.right, volTop);
    ctx.stroke();
    
    const formatVol = (v) => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : (v / 1e3).toFixed(0) + 'K';
    ctx.fillText(formatVol(maxVol), width - padding.right + 4, volTop + 8);

    showK.forEach((k, i) => {
      const absoluteIdx = showStartIndex + i;
      const open = parseFloat(k[1]), high = parseFloat(k[2]), low = parseFloat(k[3]), close = parseFloat(k[4]), vol = parseFloat(k[5]);
      const x = padding.left + i * barWidth + barWidth / 2;
      const isUp = close >= open;
      const color = isUp ? '#00ff66' : '#ff2a6d';

      ctx.strokeStyle = color;
      ctx.fillStyle = color;

      ctx.beginPath();
      ctx.moveTo(x, getYPrice(high));
      ctx.lineTo(x, getYPrice(low));
      ctx.stroke();

      const yOpen = getYPrice(open);
      const yClose = getYPrice(close);
      const bodyTop = Math.min(yOpen, yClose);
      const bodyH = Math.max(Math.abs(yOpen - yClose), 1.5);
      const bw = Math.max(barWidth * 0.7, 1);

      ctx.fillRect(x - bw / 2, bodyTop, bw, bodyH);

      ctx.fillStyle = isUp ? 'rgba(0, 255, 102, 0.4)' : 'rgba(255, 42, 109, 0.4)';
      const vY = getYVol(vol);
      ctx.fillRect(x - bw / 2, vY, bw, volTop + volH - vY);

      // 若在前後各12小時同步共振的火箭清單中，繪製 🚀 小火箭符號
      if (rocketIndices.has(absoluteIdx)) {
        ctx.save();
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#ffea00';
        ctx.shadowColor = '#ff9100';
        ctx.shadowBlur = 8;
        const highY = getYPrice(high);
        ctx.fillText('🚀', x, highY - 4);
        ctx.restore();
      } else {
        // 一般突破閃電
        const isNowAbove = checkAboveAllMAsAtIndex(closesAll, ma5All, ma30All, ma45All, ma60All, absoluteIdx);
        const isPrevAbove = checkAboveAllMAsAtIndex(closesAll, ma5All, ma30All, ma45All, ma60All, absoluteIdx - 1);
        
        if (isNowAbove && !isPrevAbove) {
          ctx.save();
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = '#ffea00';
          ctx.shadowColor = '#ffea00';
          ctx.shadowBlur = 6;
          const highY = getYPrice(high);
          ctx.fillText('⚡', x, highY - 4);
          ctx.restore();
        }
      }
    });

    const drawLine = (dataArray, color, getYFunc, width = 1.2) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      let started = false;
      dataArray.forEach((val, i) => {
        if (val === null) return;
        const x = padding.left + i * barWidth + barWidth / 2;
        const y = getYFunc(val);
        if (!started) { ctx.moveTo(x, y); started = true; } 
        else { ctx.lineTo(x, y); }
      });
      ctx.stroke();
    };

    drawLine(showMA5, '#00ff66', getYPrice);
    drawLine(showMA30, '#ffea00', getYPrice);
    drawLine(showMA45, '#ff9100', getYPrice);
    drawLine(showMA60, '#ff007f', getYPrice);

    drawLine(showVM5, '#00f0ff', getYVol, 1.0);
    drawLine(showVM10, '#9d4edd', getYVol, 1.0);
  }

  let cachedKlines15m = null;
  let cachedKlines1h = null;
  let cachedKlines4h = null;
  let cachedRocket4hIndices = new Set();
  let cachedRocket1hIndices = new Set();
  let cachedRocket15mIndices = new Set();

  async function loadAndDrawCharts(symbol) {
    if (activeChartController) activeChartController.abort();
    activeChartController = new AbortController();

    try {
      const limit15m = COUNT_15M + P3;
      const limit1h = COUNT_1H + P3;
      const limit4h = COUNT_4H + P3;

      const [res15m, res1h, res4h] = await Promise.all([
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=${limit15m}`, { signal: activeChartController.signal }),
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${limit1h}`, { signal: activeChartController.signal }),
        fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=4h&limit=${limit4h}`, { signal: activeChartController.signal })
      ]);

      if (!res15m.ok || !res1h.ok || !res4h.ok) return;

      cachedKlines15m = await res15m.json();
      cachedKlines1h = await res1h.json();
      cachedKlines4h = await res4h.json();

      // 計算三週期前後各 12 小時同步共振
      cachedRocket4hIndices.clear();
      cachedRocket1hIndices.clear();
      cachedRocket15mIndices.clear();

      const closes4h = cachedKlines4h.map(k => parseFloat(k[4]));
      const ma5_4h = calculateSMA(closes4h, P0);
      const ma30_4h = calculateSMA(closes4h, P1);
      const ma45_4h = calculateSMA(closes4h, P2);
      const ma60_4h = calculateSMA(closes4h, P3);

      const closes1h = cachedKlines1h.map(k => parseFloat(k[4]));
      const ma5_1h = calculateSMA(closes1h, P0);
      const ma30_1h = calculateSMA(closes1h, P1);
      const ma45_1h = calculateSMA(closes1h, P2);
      const ma60_1h = calculateSMA(closes1h, P3);

      const closes15m = cachedKlines15m.map(k => parseFloat(k[4]));
      const ma5_15m = calculateSMA(closes15m, P0);
      const ma30_15m = calculateSMA(closes15m, P1);
      const ma45_15m = calculateSMA(closes15m, P2);
      const ma60_15m = calculateSMA(closes15m, P3);

      // 1. 尋找 4H 第一根站上的 K 棒
      for (let i = 1; i < cachedKlines4h.length; i++) {
        const isNow4h = checkAboveAllMAsAtIndex(closes4h, ma5_4h, ma30_4h, ma45_4h, ma60_4h, i);
        const isPrev4h = checkAboveAllMAsAtIndex(closes4h, ma5_4h, ma30_4h, ma45_4h, ma60_4h, i - 1);

        if (isNow4h && !isPrev4h) {
          const t4hCenter = parseInt(cachedKlines4h[i][0]);
          const t4hStart = t4hCenter - 12 * 3600 * 1000; // 前 12 小時
          const t4hEnd = t4hCenter + 12 * 3600 * 1000;   // 後 12 小時

          let found1hMatch = false;
          let matched1hIndices = [];

          // 2. 檢查前後各 12 小時區間內是否有 1H 第一根站上
          for (let j = 1; j < cachedKlines1h.length; j++) {
            const t1h = parseInt(cachedKlines1h[j][0]);
            if (t1h >= t4hStart && t1h <= t4hEnd) {
              const isNow1h = checkAboveAllMAsAtIndex(closes1h, ma5_1h, ma30_1h, ma45_1h, ma60_1h, j);
              const isPrev1h = checkAboveAllMAsAtIndex(closes1h, ma5_1h, ma30_1h, ma45_1h, ma60_1h, j - 1);

              if (isNow1h && !isPrev1h) {
                found1hMatch = true;
                matched1hIndices.push(j);
              }
            }
          }

          if (found1hMatch) {
            let found15mMatch = false;
            let matched15mIndices = [];

            // 3. 檢查前後各 12 小時區間內是否有 15M 第一根站上
            for (let k = 1; k < cachedKlines15m.length; k++) {
              const t15m = parseInt(cachedKlines15m[k][0]);
              if (t15m >= t4hStart && t15m <= t4hEnd) {
                const isNow15m = checkAboveAllMAsAtIndex(closes15m, ma5_15m, ma30_15m, ma45_15m, ma60_15m, k);
                const isPrev15m = checkAboveAllMAsAtIndex(closes15m, ma5_15m, ma30_15m, ma45_15m, ma60_15m, k - 1);

                if (isNow15m && !isPrev15m) {
                  found15mMatch = true;
                  matched15mIndices.push(k);
                }
              }
            }

            // 如果三者皆在前後各 12 小時範圍內符合條件，標記三週期的火箭！
            if (found15mMatch) {
              cachedRocket4hIndices.add(i);
              matched1hIndices.forEach(j => cachedRocket1hIndices.add(j));
              matched15mIndices.forEach(k => cachedRocket15mIndices.add(k));
            }
          }
        }
      }

      updatePanelTags(cachedKlines15m, cachedKlines1h, cachedKlines4h);
      redrawAllPanels();

    } catch (err) {
      if (err.name !== 'AbortError') console.error(err);
    }
  }

  function updatePanelTags(k15m, k1h, k4h) {
    const b15 = isBullishAlignment(k15m);
    const b1h = isBullishAlignment(k1h);
    const b4h = isBullishAlignment(k4h);

    const hasRocket = cachedRocket4hIndices.size > 0;

    dom.tagText15m.innerText = `15M 時間框架 (100根)` + (hasRocket ? ` | 🚀  ±12H跨週期火箭共振` : (b15 && b15.isFirstBarAboveAll ? ` | ⚡ 第一根站上所有均線` : ''));
    dom.tagText1h.innerText = `1H 時間框架 (80根)` + (hasRocket ? ` | 🚀 ±12H跨週期火箭共振` : (b1h && b1h.isFirstBarAboveAll ? ` | ⚡ 第一根站上` : ''));
    dom.tagText4h.innerText = `4H 時間框架 (60根)` + (hasRocket ? ` | 🚀 ±12H跨週期火箭共振` : (b4h && b4h.isFirstBarAboveAll ? ` | ⚡ 第一根站上` : ''));
  }

  function redrawAllPanels() {
    if (cachedKlines15m) renderCanvasChart(dom.canvas15m, dom.wrapper15m, ctx15m, cachedKlines15m, COUNT_15M, '15m', cachedRocket15mIndices);
    if (cachedKlines1h) renderCanvasChart(dom.canvas1h, dom.wrapper1h, ctx1h, cachedKlines1h, COUNT_1H, '1h', cachedRocket1hIndices);
    if (cachedKlines4h) renderCanvasChart(dom.canvas4h, dom.wrapper4h, ctx4h, cachedKlines4h, COUNT_4H, '4h', cachedRocket4hIndices);
  }

  function updatePanelLayout() {
    [dom.wrapper15m, dom.wrapper1h, dom.wrapper4h].forEach(w => {
      w.classList.remove('maximized', 'minimized');
    });

    if (maximizedPeriod === '15m') {
      dom.wrapper15m.classList.add('maximized');
      dom.wrapper1h.classList.add('minimized');
      dom.wrapper4h.classList.add('minimized');
    } else if (maximizedPeriod === '1h') {
      dom.wrapper15m.classList.add('minimized');
      dom.wrapper1h.classList.add('maximized');
      dom.wrapper4h.classList.add('minimized');
    } else if (maximizedPeriod === '4h') {
      dom.wrapper15m.classList.add('minimized');
      dom.wrapper1h.classList.add('minimized');
      dom.wrapper4h.classList.add('maximized');
    }

    setTimeout(() => {
      redrawAllPanels();
    }, 50);
  }

  function handlePanelClick(period) {
    if (maximizedPeriod === period) {
      maximizedPeriod = null; 
    } else {
      maximizedPeriod = period; 
    }
    updatePanelLayout();
  }

  dom.wrapper15m.addEventListener('click', () => handlePanelClick('15m'));
  dom.wrapper1h.addEventListener('click', () => handlePanelClick('1h'));
  dom.wrapper4h.addEventListener('click', () => handlePanelClick('4h'));

  function openChartModal(index) {
    const currentList = getCurrentList();
    if (index < 0 || index >= currentList.length) return;
    currentIndex = index;
    const item = currentList[currentIndex];

    maximizedPeriod = null; 
    updatePanelLayout();

    dom.symbolRankTag.innerText = `#${currentIndex + 1}`;
    dom.symbolTitle.innerText = item.symbol;
    dom.chartModal.classList.add('active');
    dom.chartModal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');

    loadAndDrawCharts(item.symbol);
  }

  function closeChartModal() {
    if (activeChartController) activeChartController.abort();
    dom.chartModal.classList.remove('active');
    dom.chartModal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    currentIndex = -1;
    maximizedPeriod = null;
  }

  function navigateSymbol(direction) {
    const currentList = getCurrentList();
    if (currentIndex === -1 || currentList.length === 0) return;
    let newIndex = currentIndex + direction;
    if (newIndex < 0) newIndex = currentList.length - 1; 
    if (newIndex >= currentList.length) newIndex = 0; 
    openChartModal(newIndex);
  }

  let touchStartX = 0, touchStartY = 0;
  let touchEndX = 0, touchEndY = 0;

  dom.chartModal.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  dom.chartModal.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;
    
    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
      if (deltaX < 0) navigateSymbol(1);
      else navigateSymbol(-1);
    }
  }

  function switchTab(tabKey, targetBtn) {
    activeTab = tabKey;
    [dom.tab15m, dom.tab1h, dom.tab4h, dom.tabMulti].forEach(b => b.classList.remove('active'));
    targetBtn.classList.add('active');
    renderList();
  }

  dom.tab15m.addEventListener('click', () => switchTab('15m', dom.tab15m));
  dom.tab1h.addEventListener('click', () => switchTab('1h', dom.tab1h));
  dom.tab4h.addEventListener('click', () => switchTab('4h', dom.tab4h));
  dom.tabMulti.addEventListener('click', () => switchTab('multi', dom.tabMulti));

  dom.scanBtn.addEventListener('click', startScan);
  dom.closeModalBtn.addEventListener('click', closeChartModal);
  dom.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(-1); });
  dom.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(1); });
  
  dom.chartModal.addEventListener('click', (e) => {
    if (e.target === dom.chartModal) closeChartModal();
  });
  
  window.addEventListener('keydown', (e) => {
    if (!dom.chartModal.classList.contains('active')) return;
    if (e.key === 'Escape') closeChartModal();
    else if (e.key === 'ArrowLeft') navigateSymbol(-1);
    else if (e.key === 'ArrowRight') navigateSymbol(1);
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (dom.chartModal.classList.contains('active')) {
        redrawAllPanels();
      }
    }, 150);
  });
})();
</script>

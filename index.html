:root {

    --manga-yellow: #ffea00;
    --manga-orange: #ff9100;
    --manga-green: #00ff66;
    --manga-red: #ff2a6d;
}
* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {

    color: #fff;
    margin: 0;
    padding-bottom: 50px;
    min-height: 100vh;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }
.app-header {
    position: sticky;
    top: 0;
    z-index: 100;

}
.scan-btn:active { transform: scale(0.95); }
.scan-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
.progress-container { height: 3px; background: rgba(255, 255, 255, 0.05); width: 100%; }

    color: #94a3b8;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tab-btn.active {

    border-color: var(--manga-cyan);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
}
.tab-btn.low-risk {
    background: rgba(255, 234, 0, 0.15);

}
.tab-btn.low-risk.active {

}

    margin-top: 10px;
    flex-wrap: wrap;
}
.sort-label {

    font-weight: 800;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
}
.sort-btn {
    padding: 5px 10px;

    font-size: 0.7rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.18s ease;
}
.sort-btn.active {
    background: rgba(255, 0, 127, 0.18);
    border-color: var(--manga-pink);
    color: #fff;
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.22);
}
.dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.stat-card {
    background: var(--card-bg);

    border-radius: 14px;
    padding: 12px;
    text-align: center;

}
.stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800; }
.stat-card.entry { border-color: rgba(255, 0, 127, 0.4); }

.container { padding: 0 16px; }

.symbol-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid var(--manga-green);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, background-color 0.2s;
    will-change: transform;
}
.symbol-card.tier-high {
    border-left-color: var(--manga-pink);
    box-shadow: inset 3px 0 12px rgba(255, 0, 127, 0.14);
}
.symbol-card.tier-mid {
    border-left-color: var(--manga-cyan);
}
.symbol-card:hover { border-color: var(--manga-cyan); background: rgba(0, 240, 255, 0.08); transform: translateY(-2px); }
.symbol-card:active { transform: scale(0.98); }

.card-left { flex: 1; min-width: 0; }
.card-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    text-align: right;
    flex-shrink: 0;
}

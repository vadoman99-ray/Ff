<script> 
(() => {
  const API_BASE = 'https://fapi.binance.com'; 
  const P0 = 5, P1 = 30, P2 = 45, P3 = 60; 
  const MIN_VOLUME = 100000000;
  const KLINE_SHOW_COUNT = 80;
  const CONCURRENCY_LIMIT = 12;

  let rawResults = []; 
  let tickerMap = new Map(); 
  let isScanning = false;
  let countdownSec = 60;
  let timerInterval = null;
  let currentIndex = -1;

  const dom = {
    scanBtn: document.getElementById('scanBtn'),
    progress: document.getElementById('progress'),
    statTotal: document.getElementById('statTotal'),
    statEntry: document.getElementById('statEntry'),
    symbolList: document.getElementById('symbolList'),
    chartModal: document.getElementById('chartModal'),
    chartBox: document.getElementById('chartBox'),
    symbolTitle: document.getElementById('symbolTitle'),
    ma5Badge: document.getElementById('ma5Badge'),
    closeModalBtn: document.getElementById('closeModalBtn'),
    canvasWrapper: document.getElementById('canvasWrapper'),
    canvas: document.getElementById('klineCanvas'),
    tgToken: document.getElementById('tgToken'),
    tgChatId: document.getElementById('tgChatId'),
    autoScanToggle: document.getElementById('autoScanToggle'),
    timerCount: document.getElementById('timerCount')
  };

  const ctx = dom.canvas.getContext('2d');

  window.saveConfig = () => {
    localStorage.setItem('TG_BOT_TOKEN', dom.tgToken.value.trim());
    localStorage.setItem('TG_CHAT_ID', dom.tgChatId.value.trim());
  };

  function loadConfig() {
    dom.tgToken.value = localStorage.getItem('TG_BOT_TOKEN') || '';
    dom.tgChatId.value = localStorage.getItem('TG_CHAT_ID') || '';
  }

  async function sendTelegramNotification(results) {
    const token = dom.tgToken.value.trim();
    const chatId = dom.tgChatId.value.trim();
    if (!token || !chatId) return;

    let message = `⚡ <b>1H 多頭拉回+RSI確認反彈</b>\n`;
    message += `符合條件標的總數：<b>${results.length}</b> 個\n\n`;

    if (results.length === 0) {
      message += `<i>目前無符合條件之標的。</i>`;
    } else {
      const topResults = results.slice(0, 10);
      topResults.forEach((item, index) => {
        const chgSign = item.priceChange24h >= 0 ? '+' : '';
        message += `<b>#${index + 1} ${item.symbol.replace('USDT', '')}</b>\n`;
        message += `• 價格：<code>${item.price}</code> USDT\n`;
        message += `• 5RSI / 20RSI：<b>${item.rsi5.toFixed(1)} / ${item.rsi20.toFixed(1)}</b>\n`;
        message += `• 距 60MA：<b>+${item.ma3DistPercent.toFixed(2)}%</b>\n`;
        message += `• 24H 漲跌：${chgSign}${item.priceChange24h.toFixed(2)}%\n\n`;
      });

      if (results.length > 10) {
        message += `<i>...剩餘 ${results.length - 10} 個標的請至網頁查看。</i>`;
      }
    }

    try {
      await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' })
      });
    } catch (err) {
      console.error("Telegram 發送失敗:", err);
    }
  }

  function calculateSMA(data, period) { 
    const len = data.length; 
    if (len < period) return new Array(len).fill(null); 
    const ma = new Array(len).fill(null); 
    let sum = 0; 
    for (let i = 0; i < period; i++) sum += data[i]; 
    ma[period - 1] = sum / period; 
    for (let i = period; i < len; i++) { 
      sum += data[i] - data[i - period]; 
      ma[i] = sum / period; 
    } 
    return ma; 
  } 

  function calculateRSI(closes, period) {
    if (closes.length <= period) return new Array(closes.length).fill(null);
    const rsi = new Array(closes.length).fill(null);
    let gains = 0, losses = 0;

    for (let i = 1; i <= period; i++) {
      const diff = closes[i] - closes[i - 1];
      if (diff >= 0) gains += diff;
      else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    if (avgLoss === 0) rsi[period] = 100;
    else {
      const rs = avgGain / avgLoss;
      rsi[period] = 100 - (100 / (1 + rs));
    }

    for (let i = period + 1; i < closes.length; i++) {
      const diff = closes[i] - closes[i - 1];
      const gain = diff >= 0 ? diff : 0;
      const loss = diff < 0 ? -diff : 0;

      avgGain = (avgGain * (period - 1) + gain) / period;
      avgLoss = (avgLoss * (period - 1) + loss) / period;

      if (avgLoss === 0) rsi[i] = 100;
      else {
        const rs = avgGain / avgLoss;
        rsi[i] = 100 - (100 / (1 + rs));
      }
    }
    return rsi;
  }

  async function fetchSymbolDetailsData(symbol, signal) { 
    try {
      const fetchLimit = Math.max(P3 + 1, 100);
      const res = await fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${fetchLimit}`, { signal }); 
      if (!res.ok) return null; 
      const klinesRaw = await res.json(); 
      const totalLen = klinesRaw.length; 
      if (totalLen < P3) return null; 

      const closes = klinesRaw.map(k => parseFloat(k[4])); 
      const opens = klinesRaw.map(k => parseFloat(k[1]));
      const lows = klinesRaw.map(k => parseFloat(k[3]));

      const currClose = closes[totalLen - 1]; 
      const currOpen = opens[totalLen - 1];
      const prevClose = closes[totalLen - 2];
      const prevLow = lows[totalLen - 2];

      const ma5Arr = calculateSMA(closes, P0);
      const ma30Arr = calculateSMA(closes, P1);
      const ma45Arr = calculateSMA(closes, P2);
      const ma60Arr = calculateSMA(closes, P3);

      const currMA5 = ma5Arr[totalLen - 1];
      const
